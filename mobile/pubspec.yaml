name: student_app
description: "A new Flutter project."
publish_to: 'none'
version: 0.1.0+1

environment:
  sdk: ^3.11.4

dependencies:
  flutter:
    sdk: flutter
  google_fonts: ^6.1.0
  dio: ^5.4.0
  dio_cookie_manager: ^3.1.1
  cookie_jar: ^4.0.8
  flutter_secure_storage: ^9.0.0
  provider: ^6.1.1
  intl: ^0.19.0
  hive: ^2.2.3
  hive_flutter: ^1.1.0
  open_filex: ^4.4.0
  path_provider: ^2.1.2
  url_launcher: ^6.3.2
  firebase_core: ^2.27.0
  firebase_messaging: ^14.7.19
  pusher_beams: ^1.1.2
  flutter_local_notifications: ^17.0.0
  flutter_svg: ^2.0.10+1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  flutter_native_splash: ^2.4.1
  flutter_launcher_icons: ^0.14.1

flutter:
  uses-material-design: true
  assets:
    - assets/

flutter_native_splash:
  color: "#002045"
  image: assets/logo.png
  android_12:
    image: assets/logo.png
    color: "#002045"
  web: false

flutter_launcher_icons:
  android: true
  ios: false
  image_path: "assets/icon.png"
  min_sdk_android: 21
  adaptive_icon_background: "#002045"
  adaptive_icon_foreground: "assets/logo.png"
